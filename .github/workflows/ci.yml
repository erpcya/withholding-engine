name: Continuous Integration with Gradle

on:
  push:
    branches:
      - '*'
      - '*/*'
      - '**'
  pull_request:
    branches:
      - '*'
      - '*/*'
      - '**'

jobs:
  build-ci:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-package: 'jdk'
          java-version: 8
          architecture: x64

      - name: Refresh Dependencies
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 7.6
          arguments: refreshDependences

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 7.6
          arguments: build

      - name: Publish to GitHub Packages
        if: github.event_name == 'release'
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 7.6
          arguments: publish
        env:
          ORG_GRADLE_PROJECT_deployVersion: ${{ github.event.release.tag_name }}
          GITHUB_DEPLOY_USER: ${{ github.actor }}
          GITHUB_DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
