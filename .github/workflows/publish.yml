# This is a basic workflow to help you get started with Actions
# This file was contributed by Carlos Parada and Yamel Senih from ERP Consultores y Asociados, C.A

name: Publish With gradle to maven central

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the develop branch
  release:
    types: 
      - published

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  publish-sonatype:
    name: Publish Project (Sonatype)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-package: 'jdk'
          java-version: 17
          architecture: x64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew publish
        env:
          ORG_GRADLE_PROJECT_deployVersion: ${{ github.event.release.tag_name }}
          ORG_GRADLE_PROJECT_deployPublishUrl: ${{ secrets.DEPLOY_PUBLISH_SONATYPE_URL }}
          ORG_GRADLE_PROJECT_deploySigningKey: ${{ secrets.PGP_SECRET }}
          ORG_GRADLE_PROJECT_deploySigningPassword: ${{ secrets.PGP_PASSPHRASE }}
          ORG_GRADLE_PROJECT_deployUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_deployPassword: ${{ secrets.OSSRH_TOKEN }}
  publish-github:
    name: Publish Project (Github)
    runs-on: ubuntu-latest
    #  Without this the run's own token cannot write a package, and neither can any
    #  other: the default permissions of a workflow are read-only, and a publish
    #  fails with a 401 that reads as a bad credential rather than a missing grant.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-package: 'jdk'
          java-version: 17
          architecture: x64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew publish
        env:
          ORG_GRADLE_PROJECT_deployVersion: ${{ github.event.release.tag_name }}
          #  This repository's own packages when the secret is unset, which is the
          #  ordinary case for a fork that publishes for itself.
          ORG_GRADLE_PROJECT_deployPublishUrl: ${{ secrets.DEPLOY_PUBLISH_GITHUB_URL || 'https://maven.pkg.github.com/erpcya/withholding-engine' }}
          ORG_GRADLE_PROJECT_deploySigningKey: ${{ secrets.PGP_SECRET }}
          ORG_GRADLE_PROJECT_deploySigningPassword: ${{ secrets.PGP_PASSPHRASE }}
          ORG_GRADLE_PROJECT_deployUsername: "${{ github.actor }}"
          #  The run's own token when none is configured. Publishing to this
          #  repository's own packages needs nothing else, which is how the 3.9.3
          #  line published for a year — and a workflow that only works once
          #  somebody sets a secret fails on the day nobody remembers it was needed.
          ORG_GRADLE_PROJECT_deployPassword: "${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}"
