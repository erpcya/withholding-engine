name: Publish to Maven Repositories

on:
  release:
    types: 
      - published

jobs:
  publish-github:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-package: 'jdk'
          java-version: 8
          architecture: x64

      - name: Build and Publish to GitHub Packages
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 7.6
          arguments: refreshDependences publish
        env:
          ORG_GRADLE_PROJECT_deployVersion: ${{ github.event.release.tag_name }}
          GITHUB_DEPLOY_USER: ${{ github.actor }}
          GITHUB_DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-maven-local:
    name: Publish to Maven Local
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-package: 'jdk'
          java-version: 8
          architecture: x64

      - name: Build and Publish to Maven Local
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 7.6
          arguments: refreshDependences publishToMavenLocal
        env:
          ORG_GRADLE_PROJECT_deployVersion: ${{ github.event.release.tag_name }}
