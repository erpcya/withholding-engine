plugins {
	id 'java-library'
	id 'maven-publish'
	id 'signing'
}

sourceCompatibility = 1.17
def baseVersion = '3.9.4'
def baseGroupId = 'io.github.adempiere'

repositories {
    mavenLocal()
    mavenCentral()
}

allprojects {
    tasks.withType(Javadoc).all { enabled = false }
}

sourceCompatibility = 1.17
targetCompatibility = 1.17

dependencies {
   api fileTree(
        dir: 'lib',
        include: [
            '*.jar'
        ]
    )
    //	ADempiere Core
	api "${baseGroupId}:base:${baseVersion}"
}

sourceSets {
    main {
         java {
            srcDirs = ['src/main/java']
         }
    }
}

java {
    withJavadocJar()
    withSourcesJar()
}


def entityType = 'WHH'
group = "io.github.adempiere"
//  Both, and in that order. ORG_GRADLE_PROJECT_deployVersion is what publish.yml
//  has always set; ADEMPIERE_LIBRARY_VERSION is what the platform's
//  release-candidate workflow sets, and it is the same variable every other library
//  here reads. A candidate built without this publishes local-1.0.0 and looks like
//  it worked.
version = findProperty("deployVersion")
        ?: System.getenv("ADEMPIERE_LIBRARY_VERSION")
        ?: "local-1.0.0"

jar {
    manifest {
        attributes("Implementation-Title": "Withholding Engine",
                   "Implementation-Version": version, 
                   "EntityType": entityType)
    }
}

publishing {
    repositories {
		mavenLocal()

        maven {
            //  This fork publishes its own artifact, to its own packages. The
            //  property still overrides it — a different registry, a local run —
            //  but a publish with nothing configured goes somewhere correct
            //  instead of failing on an unset URL.
            url = findProperty("deployPublishUrl")
                    ?: System.properties['deploy.publish_url']
                    ?: "https://maven.pkg.github.com/erpcya/withholding-engine"
            credentials {
                username = findProperty("deployUsername") ?: System.properties['deploy.user']
                password = findProperty("deployPassword") ?: System.properties['deploy.token']
            }
        }
    }
    publications {
        mavenJava(MavenPublication) {
			groupId = group
			artifactId 'withholding-engine'
			version = version
           	from components.java
           	pom {
                name = 'Withholding Engine'
                description = 'Withholding Engine for ADempiere manage'
                url = 'http://erpya.com/'
                licenses {
                    license {
                        name = 'GNU General Public License v3.0'
                        url = 'https://www.gnu.org/licenses/gpl-3.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'yamelsenih'
                        name = 'Yamel Senih'
                        email = 'ysenih@erpya.com'
                    }
                }
                //  The fork, not upstream. Whoever follows this from a published
                //  artifact is looking for the source that produced it, and
                //  upstream does not contain it.
                scm {
                    connection = 'scm:git:git://github.com/erpcya/withholding-engine.git'
                    developerConnection = 'scm:git:ssh://github.com/erpcya/withholding-engine.git'
                    url = 'https://github.com/erpcya/withholding-engine'
                }
            }
		}
	}
}


task cleanBuildPublishLocal(type: GradleBuild) {
	tasks = ['clean', 'build', 'publishToMavenLocal']
}


signing {
	def isReleaseVersion = !version.toString().startsWith("local") && !version.toString().endsWith("-SNAPSHOT")

	sign configurations.archives

	setRequired {
		// signing is required if this is a release version and the artifacts are to be published
		// do not use hasTask() as this require realization of the tasks that maybe are not necessary
		(isReleaseVersion || version.toString().equals("build")) && gradle.taskGraph.allTasks.any {
			it.equals(PublishToMavenRepository)
		}
	}
	def signingKey = findProperty("deploySigningKey")
    def signingPassword = findProperty("deploySigningPassword")
    useInMemoryPgpKeys(signingKey, signingPassword)
    sign publishing.publications.mavenJava
}
